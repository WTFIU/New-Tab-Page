<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Custom Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search Google..." autofocus>
      <button type="submit">Find your answer</button>
    </form>
    <div id="greeting-container">
      <h1 id="greeting">Hello.</h1>
      <p id="time-display"></p>
    </div>
  </main>

  <div id="color-picker-container">
    <label for="bg-color-picker">Background:</label>
    <input type="color" id="bg-color-picker" value="#2c3e50">
  </div>

  <script src="newtab.js"></script>
</body>
</html>
